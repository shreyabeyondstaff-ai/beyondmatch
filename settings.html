<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings – BeyondMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="rec-common.css" />
  <link rel="stylesheet" href="theme.css" />

</head>

<body>

<!-- SIDEBAR — populated dynamically by role -->
<aside class="sidebar">
  <h2 class="brand">BeyondMatch</h2>
  <nav class="menu" id="sidebarMenu">
    <!-- injected by JS -->
  </nav>
  <button class="logout-btn" onclick="unifiedLogout()">⏻ Logout</button>
    <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="theme-toggle-label" data-theme-label>Dark mode</span>
      <span class="theme-toggle-track"></span>
    </button>
</aside>

<!-- MAIN -->
<main class="main">

  <button class="back-btn" onclick="goBack()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Go Back
  </button>

  <div class="page-title">
    <h1>Account Settings</h1>
    <p>Manage your account details and preferences.</p>
  </div>

  <div class="settings-grid">

    <!-- ACCOUNT DETAILS -->
    <div class="settings-card">
      <div class="card-header">
        <div class="card-icon blue">👤</div>
        <div class="card-title">Account Details</div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Email</span>
        <span class="setting-value" id="email">Loading…</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Role</span>
        <span class="role-badge candidate" id="role">Loading…</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">User ID</span>
        <span class="setting-value" id="uid" style="font-size:11px;opacity:0.6;">—</span>
      </div>
      <div class="setting-row">
        <span class="setting-label">Member Since</span>
        <span class="setting-value" id="since">—</span>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="settings-card">
      <div class="card-header">
        <div class="card-icon green">⚡</div>
        <div class="card-title">Quick Actions</div>
      </div>
      <button class="action-btn" onclick="resetPassword()">
        <div class="action-btn-icon blue">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7aa2ff" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        Change Password
      </button>
      <button class="action-btn" onclick="downloadData()">
        <div class="action-btn-icon green">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        Download My Data
      </button>
    </div>

    <!-- DANGER ZONE -->
    <div class="settings-card danger">
      <div class="card-header">
        <div class="card-icon red">⚠️</div>
        <div class="card-title">Danger Zone</div>
      </div>
      <div class="danger-note">
        These actions are permanent and cannot be undone. Please proceed with caution.
      </div>
      <button class="danger-btn" onclick="deleteAccount()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
        Delete Account
      </button>
    </div>

  </div>
</main>

<script type="module" src="auth.js"></script>
<script type="module" src="settings.js"></script>

</body>
</html>
