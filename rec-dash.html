<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recruiter Dashboard – BeyondMatch</title>
  <link rel="stylesheet" href="recruiter-matches.css" />
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js" integrity="sha384-fQPeMfjdtgCK12Qc+Nf6MXgVkTFu/9GEGi8IARBPvg0MxEJ+0vo88ViuO54qE4UU" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="rec-common.css" />
  <link rel="stylesheet" href="theme.css" />

</head>
<body>

<div id="lbar"></div>

<aside class="sidebar">
  <a href="/rec-dash.html" style="text-decoration:none;"><h2 class="brand">BeyondMatch</h2></a>
  <nav class="menu">
     <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="theme-toggle-label" data-theme-label>Dark mode</span>
      <span class="theme-toggle-track"></span>
    </button>
    <a href="rec-dash.html"     class="menu-item active">Dashboard</a>
    <a href="rec-postjob.html"     class="menu-item">Post Job</a>
    <a href="rec-jobs.html"     class="menu-item">My Jobs</a>
    <a href="jobs.html" class="menu-item">Jobs</a>
    <a href="cand-matches.html" class="menu-item">Candidate Matches</a>
    <a href="rec-locatehire.html" class="menu-item">CandidateMap</a>
     <a href="rec-leads.html" class="menu-item">Find Leads</a>
    <a href="rec-actions.html"  class="menu-item">Recruiter Actions</a>
    <a href="settings.html"     class="menu-item">Settings</a>
    <button class="menu-item logout-btn" onclick="unifiedLogout()">⏻ Logout</button>
   
  </nav>
</aside>

<main class="main">

  <!-- HEADER -->
  <div class="dash-header">
    <div>
      <h1>Hiring Dashboard</h1>
      <p id="sub">Loading your hiring overview…</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="rec-pill" id="pill" style="display:none;">
        <div class="rec-avatar" id="av">R</div>
        <div>
          <div class="rec-pill-name" id="pname">—</div>
          <div class="rec-pill-org"  id="porg">—</div>
        </div>
      </div>
      <button class="rbtn" id="rbtn" onclick="boot()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- ERROR BANNER -->
  <div id="errBanner" style="display:none;background:rgba(248,113,113,0.1);
    border:1px solid rgba(248,113,113,0.25);border-radius:12px;
    padding:14px 18px;color:#f87171;font-size:13px;flex-shrink:0;"></div>

  <!-- POWER BI EMBED -->
  <div id="pbi-container">
    <div id="pbi-shimmer" class="shim"></div>
  </div>

</main>

<script type="module" src="auth.js"></script>
<script type="module" src="recruiter.js"></script>
</body>
</html>
