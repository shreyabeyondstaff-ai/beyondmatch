<head>

  <meta charset="UTF-8" />

  <title>LocateHire – BeyondMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />

  <script src="libs/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="cand-common.css" />
  <link rel="stylesheet" href="theme.css" />

</head>

<body>

<!-- ════════ SIDEBAR ════════ -->
<aside class="cand-sidebar">
  <a href="/login.html" style="text-decoration:none;"><h2 class="cand-brand">BeyondMatch</h2></a>
  <nav class="cand-menu">
    <a href="candidate-dashboard.html" class="cand-menu-item">Dashboard</a>
    <a href="resume.html"              class="cand-menu-item">Resume Analysis</a>
    <a href="jobmatches.html"          class="cand-menu-item">Job Matches</a>
    <a href="savedjobs.html"           class="cand-menu-item">Saved Jobs</a>
    <a href="locatehire.html"          class="cand-menu-item active">LocateHire</a>
    <a href="settings.html"            class="cand-menu-item">Settings</a>
  </nav>
  <button class="logout-btn" onclick="unifiedLogout()">⏻ Logout</button>
    <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="theme-toggle-label" data-theme-label>Dark mode</span>
      <span class="theme-toggle-track"></span>
    </button>
</aside>

<!-- ════════ PAGE SHELL ════════ -->
<div class="page-shell">

  <!-- TITLE BAR -->
  <div class="page-title-bar">
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#7aa2ff" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
      </svg>
      LocateHire
    </h1>
    <p>Explore job opportunities visually across the globe.</p>
  </div>

  <!-- MAP + PANEL -->
  <div class="map-row">

    <div id="map"></div>

    <div id="cityPanel" class="city-panel hidden">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <h3 id="panelTitle">Jobs</h3>
          <div class="panel-job-count" id="panelCount"></div>
        </div>
        <button class="panel-close" onclick="closeCityPanel()" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="panel-body" id="panelGrid">
        <!-- placeholder shown by JS -->
      </div>
    </div>

  </div>
</div>

<!-- SCRIPTS -->
<script type="module" src="auth.js"></script>
<script type="module" src="candidate.js"></script>

</body>
</html>
