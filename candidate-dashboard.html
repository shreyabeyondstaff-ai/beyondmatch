<!DOCTYPE html>
<html lang="en">
<head>
<script src="theme.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – BeyondMatch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js" integrity="sha384-fQPeMfjdtgCK12Qc+Nf6MXgVkTFu/9GEGi8IARBPvg0MxEJ+0vo88ViuO54qE4UU" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="cand-common.css" />
  <link rel="stylesheet" href="theme.css" />

</head>
<body>

<div id="lbar"></div>

<aside class="sidebar">
  <a href="/candidate-dashboard.html" class="brand">BeyondMatch</a>
  <nav class="nav">
    <a href="candidate-dashboard.html" class="nav-link active">Dashboard</a>
    <a href="resume.html"              class="nav-link">Resume Analysis</a>
    <a href="jobmatches.html"          class="nav-link">Job Matches</a>
    <a href="savedjobs.html"           class="nav-link">Saved Jobs</a>
    <a href="locatehire.html"          class="nav-link">LocateHire</a>
    <a href="cand_actions.html"          class="nav-link">Candidate Actions</a>
    <a href="settings.html"            class="nav-link">Settings</a>
  </nav>
  <button class="logout-btn" onclick="unifiedLogout()">⏻ Logout</button>
    <button class="theme-toggle-btn" data-theme-toggle type="button" aria-label="Toggle light/dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <span class="theme-toggle-label" data-theme-label>Dark mode</span>
      <span class="theme-toggle-track"></span>
    </button>
</aside>

<main class="main">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>My Dashboard</h1>
      <p id="sub">Loading your dashboard…</p>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div class="cand-pill" id="pill" style="display:none;">
        <div class="avatar" id="av">?</div>
        <div>
          <div class="pill-name" id="pname">—</div>
          <div class="pill-role" id="prole">—</div>
          <div class="pill-id"   id="pid">—</div>
        </div>
      </div>
      <button class="rbtn" id="rbtn" onclick="boot()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>
  </div>

  <!-- ERROR BANNER -->
  <div id="errBanner" style="display:none;background:rgba(248,113,113,0.1);
    border:1px solid rgba(248,113,113,0.25);border-radius:12px;
    padding:14px 18px;color:#f87171;font-size:13px;flex-shrink:0;"></div>

  <!-- POWER BI EMBED -->
  <div id="pbi-container">
    <div id="pbi-shimmer" class="shim"></div>
  </div>

</main>

<script type="module" src="auth.js"></script>
<script type="module" src="candidate.js"></script>
</body>
</html>
